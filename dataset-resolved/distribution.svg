<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Exact resolved service distribution</title>
  <desc id="desc">Concrete Vulhub image and self-generated service selections, plus fixed topology and segmentation configuration, materialized in the resolved dataset.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle, .note { font-size: 12px; fill: #6b7280; }
    .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .panel-title { font-size: 18px; font-weight: 700; }
    .label { font-size: 12px; }
    .value { font-size: 12px; font-weight: 700; }
    .big { font-size: 28px; font-weight: 700; }
  </style>
  <rect width="1200" height="920" fill="#f8fafc"/>
  <text x="45" y="52" class="title">Exact resolved service distribution</text>
  <text x="45" y="76" class="subtitle">226 fixed scenarios · catalog snapshot at /Users/jcacosta/Documents/GitHub/scenarioforge</text>
  <rect x="35" y="102" width="360" height="150" rx="12" class="panel"/>
  <text x="58" y="136" class="panel-title">Vulhub images</text>
  <text x="58" y="181" class="big">460</text><text x="58" y="203" class="note">selected topology nodes</text>
  <text x="205" y="181" class="big">294</text><text x="205" y="203" class="note">unique concrete images</text>
  <text x="58" y="231" class="note">1–6 uses per image; all 294 images represented</text>
  <rect x="420" y="102" width="360" height="150" rx="12" class="panel"/>
  <text x="443" y="136" class="panel-title">Self-generated services</text>
  <text x="443" y="181" class="big">411</text><text x="443" y="203" class="note">selected topology nodes</text>
  <text x="590" y="181" class="big">85/85</text><text x="590" y="203" class="note">enabled generators represented</text>
  <text x="443" y="231" class="note">4–5 uses per generator; all 85 represented</text>
  <rect x="805" y="102" width="360" height="150" rx="12" class="panel"/>
  <text x="828" y="136" class="panel-title">Fixed network topology</text>
  <text x="828" y="181" class="big">463</text><text x="828" y="203" class="note">routers</text>
  <text x="975" y="181" class="big">1534</text><text x="975" y="203" class="note">Docker hosts</text>
  <text x="828" y="231" class="note">2868 total planned nodes including catalog nodes</text>
  <rect x="35" y="280" width="1130" height="225" rx="12" class="panel"/>
  <text x="58" y="316" class="panel-title">Network configuration</text>
  <text x="58" y="346" class="value">Topology scale</text><text x="58" y="368" class="note">55 small (≤6), 144 medium (7–12), 27 large (13+) base-node scenarios</text>
  <text x="58" y="392" class="note">1997 base nodes total; 4–20 base and 5–27 total nodes per scenario.</text>
  <text x="650" y="346" class="value">Services and flows</text><text x="650" y="368" class="note">829 fixed service assignments · 186 generator scenarios · 196 chained scenarios</text>
  <text x="650" y="392" class="note">Chain balance: 2 hops × 49 · 3 hops × 49 · 4 hops × 49 · 5 hops × 49</text>
  <text x="58" y="434" class="value">Segmentation</text><text x="58" y="456" class="note">148 scenarios · 105 Firewall rows · 103 NAT rows · 42 pivot scenarios / 53 rows · density 0.30–0.55</text>
  <text x="650" y="434" class="value">Subnet CIDRs</text><text x="650" y="456" class="note">Allocated during ScenarioForge topology; these YAMLs fix the inputs.</text>

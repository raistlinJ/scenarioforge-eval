name: "dataset-artifact-name-identity"
iterations: 5
topology:
  routers: 2
  hosts: [4, 6]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [2, 4]
  include: ["SSH", "HTTP"]
vulns:
  enabled: false
  count: 0
flag_node_generators:
  enabled: true
  randomize: true
  count: [2, 3]
  include: ["DNS:*", "LDAP:*"]
flows:
  enabled: true
  chain_length: 2
  allow_duplicates: false
  include_all_topology_pivots: true
traffic:
  profile: light
  payload_types: [audio]
segmentation:
  enabled: true
  density: 0.3
  accessible_by_pivot: true
  items:
    - type: NAT
      count: 1
      pivot_enabled: true
      pivot_provider: flag-node-generator
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 15
    strict: true

name: "dataset-artifact-name-identity"
iterations: 5
topology:
  routers: 2
  hosts: [4, 6]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [2, 4]
  include: ["SSH", "HTTP"]
vulns:
  enabled: false
  count: 0
flag_node_generators:
  enabled: true
  randomize: true
  count: [1, 3]
  include: ["DNS:*", "LDAP:*"]
flows:
  enabled: false
  chain_length: 0
traffic:
  profile: light
  payload_types: [audio]
segmentation:
  enabled: true
  density: 0.3
hitl:
  use_env: false
validation:
  policy: "strict"

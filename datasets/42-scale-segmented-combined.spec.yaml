name: "dataset-scale-segmented-combined"
iterations: 5
topology:
  routers: [3, 5]
  hosts: [10, 16]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [5, 8]
  include: ["SSH", "HTTP"]
vulns:
  enabled: true
  randomize: true
  count: [2, 5]
  include: ["struts2", "drupal", "elasticsearch", "redis", "confluence"]
flag_node_generators:
  enabled: true
  randomize: true
  count: [3, 6]
  include: ["HTTP:*", "SSH:*", "NFS:*", "Database:*", "Dependency Consumer:*"]
flows:
  enabled: true
  chain_length: 5
  allow_duplicates: false
traffic:
  profile: heavy
  payload_types: [audio, video]
segmentation:
  enabled: true
  density: 0.55
  items:
    - type: NAT
      count: 1
      pivot_enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 15
    strict: true

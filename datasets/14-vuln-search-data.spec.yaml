name: "dataset-vuln-search-data"
iterations: 5
topology:
  routers: 2
  hosts: [5, 7]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [2, 4]
  include: ["HTTP", "SSH"]
vulns:
  enabled: true
  randomize: true
  count: [1, 3]
  include: ["elasticsearch"]
flag_node_generators:
  enabled: false
  count: 0
flows:
  enabled: false
  chain_length: 0
traffic:
  profile: medium
  payload_types: [text, video]
segmentation:
  enabled: true
  density: 0.4
hitl:
  use_env: false
validation:
  policy: "strict"

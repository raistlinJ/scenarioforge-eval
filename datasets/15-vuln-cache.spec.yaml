name: "dataset-vuln-cache"
iterations: 5
topology:
  routers: 1
  hosts: 4
  randomize: false
services:
  enabled: true
  randomize: true
  count: [2, 3]
  include: ["SSH", "HTTP"]
vulns:
  enabled: true
  randomize: true
  count: 2
  include: ["redis"]
flag_node_generators:
  enabled: false
  count: 0
flows:
  enabled: true
  chain_length: 2
  allow_duplicates: false
traffic:
  profile: medium
  payload_types: [text, gibberish]
segmentation:
  enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"

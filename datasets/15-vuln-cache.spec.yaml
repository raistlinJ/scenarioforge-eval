name: "dataset-vuln-cache"
iterations: 5
topology:
  routers: 1
  hosts: 4
  randomize: false
services:
  enabled: true
  randomize: true
  count: [2, 3]
  include: ["SSH", "HTTP"]
vulns:
  enabled: true
  randomize: true
  count: [1, 2]
  include: ["redis"]
flag_node_generators:
  enabled: false
  count: 0
flows:
  enabled: false
  chain_length: 0
traffic:
  profile: medium
  payload_types: [text, gibberish]
segmentation:
  enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"

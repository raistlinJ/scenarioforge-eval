name: "dataset-mixed-cms-remote-access"
iterations: 5
topology:
  routers: [1, 2]
  hosts: [4, 6]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [2, 4]
  include: ["SSH", "HTTP"]
vulns:
  enabled: true
  randomize: true
  count: [1, 2]
  include: ["drupal"]
flag_node_generators:
  enabled: true
  randomize: true
  count: [1, 2]
  include: ["SSH:*", "Git:*"]
flows:
  enabled: true
  chain_length: 2
  allow_duplicates: false
  include_all_topology_pivots: true
traffic:
  profile: light
  payload_types: [video]
segmentation:
  enabled: true
  density: 0.3
  accessible_by_pivot: true
  items:
    - type: NAT
      count: 1
      pivot_enabled: true
      pivot_provider: ssh-fallback
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 15
    strict: true

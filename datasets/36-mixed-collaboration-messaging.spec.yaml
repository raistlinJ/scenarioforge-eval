name: "dataset-mixed-collaboration-messaging"
iterations: 5
topology:
  routers: 2
  hosts: [6, 8]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [3, 5]
  include: ["SSH", "HTTP"]
vulns:
  enabled: true
  randomize: true
  count: [1, 3]
  include: ["confluence"]
flag_node_generators:
  enabled: true
  randomize: true
  count: 3
  include: ["Mail:*", "MQTT:*"]
flows:
  enabled: true
  chain_length: 4
  allow_duplicates: false
traffic:
  profile: heavy
  payload_types: [text, video]
segmentation:
  enabled: true
  density: 0.4
  items:
    - type: Firewall
      count: 1
      pivot_enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"

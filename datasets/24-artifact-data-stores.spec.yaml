name: "dataset-artifact-data-stores"
iterations: 5
topology:
  routers: 2
  hosts: [5, 7]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [2, 4]
  include: ["HTTP", "SSH"]
vulns:
  enabled: false
  count: 0
flag_node_generators:
  enabled: true
  randomize: true
  count: 4
  include: ["Database:*", "Cache:*"]
flows:
  enabled: true
  chain_length: 4
  allow_duplicates: false
traffic:
  profile: medium
  payload_types: [photo, video]
segmentation:
  enabled: true
  density: 0.4
  items:
    - type: NAT
      count: 1
      pivot_enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 15
    strict: true

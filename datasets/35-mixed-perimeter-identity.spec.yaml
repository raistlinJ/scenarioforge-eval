name: "dataset-mixed-perimeter-identity"
iterations: 5
topology:
  routers: 2
  hosts: [5, 7]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [2, 5]
  include: ["SSH", "HTTP"]
vulns:
  enabled: true
  randomize: true
  count: [1, 2]
  include: ["nginx"]
flag_node_generators:
  enabled: true
  randomize: true
  count: [2, 3]
  include: ["DNS:*", "LDAP:*"]
flows:
  enabled: true
  chain_length: 3
  allow_duplicates: false
traffic:
  profile: medium
  payload_types: [video, gibberish]
segmentation:
  enabled: true
  density: 0.35
  items:
    - type: NAT
      count: 1
      pivot_enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 15
    strict: true

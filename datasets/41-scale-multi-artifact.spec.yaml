name: "dataset-scale-multi-artifact"
iterations: 5
topology:
  routers: [2, 4]
  hosts: [8, 12]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [4, 7]
  include: ["SSH", "HTTP"]
vulns:
  enabled: false
  count: 0
flag_node_generators:
  enabled: true
  randomize: true
  count: [3, 6]
  include: ["HTTP:*", "SSH:*", "DNS:*", "NFS:*", "Database:*"]
flows:
  enabled: true
  chain_length: 3
  allow_duplicates: false
  include_all_topology_pivots: true
traffic:
  profile: heavy
  payload_types: [photo, gibberish]
segmentation:
  enabled: true
  density: 0.45
  accessible_by_pivot: true
  items:
    - type: Firewall
      count: 1
      pivot_enabled: true
      pivot_provider: flag-node-generator
hitl:
  use_env: false
validation:
  policy: "strict"

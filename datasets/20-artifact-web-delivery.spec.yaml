name: "dataset-artifact-web-delivery"
iterations: 5
topology:
  routers: 1
  hosts: [3, 5]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [2, 4]
  include: ["HTTP"]
vulns:
  enabled: false
  count: 0
flag_node_generators:
  enabled: true
  randomize: true
  count: [1, 3]
  include: ["HTTP:*", "HTTPS:*"]
flows:
  enabled: false
  chain_length: 0
traffic:
  profile: light
  payload_types: [photo]
segmentation:
  enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"

name: "dataset-artifact-remote-access"
iterations: 5
topology:
  routers: 1
  hosts: [3, 5]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [1, 3]
  include: ["SSH"]
vulns:
  enabled: false
  count: 0
flag_node_generators:
  enabled: true
  randomize: true
  count: [1, 3]
  include: ["SSH:*", "Git:*"]
flows:
  enabled: true
  chain_length: 1
  allow_duplicates: false
traffic:
  profile: light
  payload_types: [photo]
segmentation:
  enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 15
    strict: true

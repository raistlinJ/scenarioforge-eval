name: "dataset-mixed-shared-data"
iterations: 5
topology:
  routers: 2
  hosts: [6, 8]
  randomize: true
services:
  enabled: true
  randomize: true
  count: [3, 5]
  include: ["SSH", "HTTP"]
vulns:
  enabled: true
  randomize: true
  count: [1, 2]
  include: ["redis"]
flag_node_generators:
  enabled: true
  randomize: true
  count: 4
  include: ["NFS:*", "SMB:*", "Network Share:*"]
flows:
  enabled: true
  chain_length: 5
  allow_duplicates: false
traffic:
  profile: medium
  payload_types: [audio, video]
segmentation:
  enabled: true
  density: 0.45
  items:
    - type: Firewall
      count: 1
      pivot_enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"

# Database-category generators, whose ids are numeric in the catalog.
name: "ai-named-gen-database"
iterations: 1
seed: 20260813
ai:
  prompt: >-
    two routers and three docker hosts with the "Database: MySQL Backup
    Table" and "Database: Postgres Customer Dump" flag node generators
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 2
  hosts: 3
  flag_node_generators: 2
  generator_names:
  - 'Database: MySQL Backup Table'
  - 'Database: Postgres Customer Dump'
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

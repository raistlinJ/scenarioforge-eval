# Names two HTTP generators; exercises catalog search on a common category.
name: "ai-named-gen-http"
iterations: 1
seed: 20260812
ai:
  prompt: >-
    two routers and three docker hosts with the "HTTP: SQLi Customer Lookup"
    and "HTTP: Backup Archive Listing" flag node generators
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 2
  hosts: 3
  flag_node_generators: 2
  generator_names:
  - 'HTTP: SQLi Customer Lookup'
  - 'HTTP: Backup Archive Listing'
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

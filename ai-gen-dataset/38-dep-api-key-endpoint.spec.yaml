# API-key consumer paired with a producer that emits one.
name: "ai-dep-api-key-endpoint"
iterations: 1
seed: 20260838
ai:
  prompt: >-
    two routers and four docker hosts with the "HTTPS: Token Debug API" and
    "Dependency Consumer: API Key Admin Endpoint" flag node generators
    chained together
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 2
  hosts: 4
  flag_node_generators: 2
  generator_names:
  - 'HTTPS: Token Debug API'
  - 'Dependency Consumer: API Key Admin Endpoint'
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

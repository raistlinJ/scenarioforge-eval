# Both segmentation controls in one prompt.
name: "ai-firewall-and-nat"
iterations: 1
seed: 20260845
ai:
  prompt: >-
    three routers and five docker hosts with one firewall and one NAT
  timeout_s: 480
  retries: 1
flows:
  # This prompt describes a plain network with no vulnerabilities or flag
  # generators, so there is nothing for Flow to chain. Left at its default the
  # evaluator enables sequencing anyway and the run fails with "No eligible
  # nodes found in preview plan".
  enabled: false
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 3
  hosts: 5
  segmentation:
  - Firewall
  - NAT
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

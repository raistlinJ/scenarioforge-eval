# Every section at once; the widest prompt in the suite.
name: "ai-full-stress"
iterations: 1
seed: 20260850
ai:
  prompt: >-
    four routers, eight docker hosts, ssh and https services, three
    vulnerabilities, three flag node generators, one firewall, one NAT, and
    light background traffic
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 4
  hosts: 8
  services:
  - SSH
  - HTTPS
  vulnerabilities: 3
  flag_node_generators: 3
  segmentation:
  - Firewall
  - NAT
  traffic: true
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

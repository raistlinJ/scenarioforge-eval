# Several services in one prompt; no challenge content.
name: "ai-service-variety"
iterations: 1
seed: 20260844
ai:
  prompt: >-
    two routers and five docker hosts running ssh, http and https services
  timeout_s: 480
  retries: 1
flows:
  # This prompt describes a plain network with no vulnerabilities or flag
  # generators, so there is nothing for Flow to chain. Left at its default the
  # evaluator enables sequencing anyway and the run fails with "No eligible
  # nodes found in preview plan".
  enabled: false
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 2
  hosts: 5
  services:
  - SSH
  - HTTP
  - HTTPS
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

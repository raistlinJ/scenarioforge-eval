# DNS generators; zone-transfer and TXT-record variants.
name: "ai-named-gen-dns"
iterations: 1
seed: 20260817
ai:
  prompt: >-
    two routers and three docker hosts with the "DNS: Zone Transfer Records"
    and "DNS: TXT Secret Record" flag node generators
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 2
  hosts: 3
  flag_node_generators: 2
  generator_names:
  - 'DNS: Zone Transfer Records'
  - 'DNS: TXT Secret Record'
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

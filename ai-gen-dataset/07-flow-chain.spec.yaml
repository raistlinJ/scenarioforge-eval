# Asks for a multi-step chain, which drives FlowState rather than topology alone.
name: "ai-flow-chain"
iterations: 1
seed: 20260807
ai:
  prompt: >-
    two routers and four docker hosts with three flag node generators
    chained into a three step capture the flag path
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 2
  hosts: 4
  flag_node_generators: 3
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

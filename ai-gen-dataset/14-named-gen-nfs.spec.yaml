  hosts: 4
  flag_node_generators: 2
  generator_names:
  - 'NFS: Legal Hold Archive'
  - 'NFS: Build Cache Share'
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

# NFS is the largest category (8 entries); checks the right two are picked.
name: "ai-named-gen-nfs"
iterations: 1
seed: 20260814
ai:
  prompt: >-
    two routers and four docker hosts with the "NFS: Legal Hold Archive" and
    "NFS: Build Cache Share" flag node generators

# Pivot-producing consumer; exercises pivot handling from a prompt.
name: "ai-dep-port-forward-pivot"
iterations: 1
seed: 20260839
ai:
  prompt: >-
    three routers and five docker hosts with the "Dependency Consumer: Port
    Forward Pivot" flag node generator and one host reachable only by
    pivoting
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 3
  hosts: 5
  flag_node_generators: 1
  generator_names:
  - 'Dependency Consumer: Port Forward Pivot'
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

# Named service by prose. Exercises the Services section from a prompt.
name: "ai-ssh-fleet"
iterations: 1
seed: 20260803
ai:
  prompt: "two routers and five docker hosts, every host running the ssh service"
  timeout_s: 480
  retries: 1
# What the prompt asked for, used to grade the generated scenario.
# Only declared fields are scored.
expected:
  routers: 2
  hosts: 5
  services:
  - SSH
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

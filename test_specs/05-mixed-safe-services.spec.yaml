name: "mixed-safe-services"
iterations: 2
topology:
  routers: 2
  hosts: 6
  randomize: false
services:
  enabled: true
  randomize: true
  count: 6
  include: ["SSH", "HTTP"]
  exclude: ["DHCPClient"]
vulns:
  enabled: false
  count: 0
flag_node_generators:
  enabled: false
  count: 0
flows:
  enabled: false
  chain_length: 0
segmentation:
  enabled: true
  density: 0.4
  nat_mode: "MASQUERADE"
  dnat_probability: 0.5
  items:
    - type: "NAT"
      count: 1
      pivot_enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

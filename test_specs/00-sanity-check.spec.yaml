name: "sanity-check"
iterations: 1
topology:
  routers: 1
  hosts: 1
  randomize: false
services:
  enabled: true
  randomize: false
  count: 1
  include: ["SSH"]
vulns:
  enabled: true
  randomize: false
  count: 1
flag_node_generators:
  enabled: true
  count: 1
flows:
  enabled: true
  randomize: false
  # One vulnerability plus one flag-node-generator are mandatory chain nodes.
  chain_length: 2
  allow_duplicates: false
segmentation:
  enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false

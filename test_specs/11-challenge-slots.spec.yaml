# Declared challenge slots must be reachable.
#
# A slot is capacity, not a placement: both kinds materialise empty and
# flag-sequencing fills one only when the requested chain length needs it. They
# add to the counts declared in the Vulnerabilities and Flag Node Generators
# sections. Flow's requested length counts the two concrete vulnerabilities,
# two concrete generators, and two flag-gen slots. The two vulnerability slots
# are appended automatically by topology expansion, producing eight final steps.
#
# Requesting less than the ceiling leaves slots unfilled, which is correct but
# exercises nothing; requesting the ceiling is what proves a slot can be reached
# at all.
name: "challenge-slots"
iterations: 1
topology:
  routers: 2
  hosts: 6
  docker: 1
  vulnerability_slots: 2
  flag_gen_slots: 2
  randomize: false
services:
  enabled: false
  count: 0
vulns:
  enabled: true
  randomize: true
  count: 2
flag_node_generators:
  enabled: true
  count: 2
flows:
  enabled: true
  randomize: false
  chain_length: 6
  # Select the four optional slots. Topology expansion then appends the two
  # concrete vulnerabilities and two concrete flag-node-generators.
  chain_ids: ["14", "15", "16", "17"]
  allow_duplicates: false
  dependency_level: 3
  timeout_s: 900
segmentation:
  enabled: true
  density: 0.45
  items:
    - type: "Firewall"
      count: 1
      pivot_enabled: false
hitl:
  use_env: false
validation:
  policy: "strict"
  check_artifacts:
    enabled: true
    delay_seconds: 60
    strict: false
